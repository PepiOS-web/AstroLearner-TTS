[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astrolearner-tts"
version = "0.1.0"
description = "Local Spanish and English narration studio for AstroLearner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["qwen-tts==0.1.1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[project.scripts]
astrolearner-tts = "astro_tts.__main__:main"

[tool.setuptools.packages.find]
include = ["astro_tts*"]

[tool.setuptools.package-data]
astro_tts = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
